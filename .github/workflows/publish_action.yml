# Publishes to the Comfy Registry (https://registry.comfy.org) whenever pyproject.toml changes on main,
# i.e. when you bump the version. Users then get the update through ComfyUI Manager / comfy-cli.
# One-time setup: registry.comfy.org → your publisher → API key → GitHub repo → Settings → Secrets and
# variables → Actions → New repository secret named REGISTRY_ACCESS_TOKEN.
name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version numbers match
        run: |
          a=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          b=$(grep -m1 '__version__' higgsfield_nodes/__init__.py | cut -d'"' -f2)
          echo "pyproject=$a package=$b"
          test "$a" = "$b"

      - name: Publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
